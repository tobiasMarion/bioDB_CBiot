server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routes (TanStack Router) must resolve to index.html.
    # The ES-Builder front Nginx strips the /projeto-x/ prefix before forwarding here.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
